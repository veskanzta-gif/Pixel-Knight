<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Pixel Knight</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10131c;color:white;font-family:monospace;overflow:hidden;touch-action:none}
#game{display:block;width:100vw;height:100dvh;image-rendering:pixelated;background:#10131c}
#ui{position:fixed;inset:0;pointer-events:none}
#top{padding:12px;font-size:14px;text-shadow:2px 2px #000}
#controls{position:absolute;bottom:20px;width:100%;display:flex;justify-content:space-between;padding:0 20px}
.group{display:flex;gap:12px}
.btn{width:65px;height:65px;border:2px solid #ffffff55;background:#202b40cc;color:white;border-radius:12px;font-size:25px;display:flex;align-items:center;justify-content:center;pointer-events:auto;user-select:none}
.btn:active{background:#627da0}
#msg{position:absolute;top:45%;width:100%;text-align:center;font-size:22px;color:#fff;text-shadow:3px 3px #000}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
<div id="top">⚔ PIXEL KNIGHT　❤ <span id="hp">3</span>　🪙 <span id="coins">0</span></div>
<div id="msg">PIXEL KNIGHT</div>
<div id="controls">
<div class="group">
<div class="btn" id="left">◀</div>
<div class="btn" id="right">▶</div>
</div>
<div class="group">
<div class="btn" id="attack">⚔</div>
<div class="btn" id="jump">▲</div>
</div>
</div>
<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
ctx.imageSmoothingEnabled=false;

const W=480,H=270;
canvas.width=W;canvas.height=H;

let keys={},touch={left:false,right:false,jump:false,attack:false};
let camera=0,coins=0,hp=3,dead=false,won=false;
let frame=0;

const player={
 x:50,y:180,w:14,h:22,
 vx:0,vy:0,
 grounded:false,
 face:1,
 inv:0
};

const platforms=[
 {x:0,y:235,w:500,h:35},
 {x:170,y:190,w:60,h:10},
 {x:280,y:160,w:65,h:10},
 {x:400,y:205,w:70,h:10},
 {x:530,y:180,w:70,h:10},
 {x:650,y:145,w:80,h:10},
 {x:790,y:190,w:80,h:10},
 {x:930,y:160,w:70,h:10},
 {x:1080,y:205,w:80,h:10},
 {x:1210,y:170,w:90,h:10},
 {x:1390,y:190,w:100,h:10},
 {x:1540,y:150,w:100,h:10},
 {x:1700,y:235,w:400,h:35}
];

let enemies=[
 {x:350,y:213,w:14,h:15,vx:0.5,alive:true},
 {x:600,y:158,w:14,h:15,vx:-0.5,alive:true},
 {x:850,y:213,w:14,h:15,vx:0.6,alive:true},
 {x:1150,y:213,w:14,h:15,vx:-0.6,alive:true},
 {x:1450,y:175,w:14,h:15,vx:0.6,alive:true}
];

let treasure=[
 {x:190,y:165,taken:false},
 {x:310,y:135,taken:false},
 {x:560,y:155,taken:false},
 {x:680,y:120,taken:false},
 {x:950,y:135,taken:false},
 {x:1240,y:145,taken:false},
 {x:1570,y:125,taken:false}
];

function rect(x,y,w,h,c){
 ctx.fillStyle=c;ctx.fillRect(Math.floor(x),Math.floor(y),w,h);
}

function drawKnight(x,y){
 // shadow
 rect(x+2,y+21,12,3,"#15131c");
 // legs
 rect(x+3,y+15,4,6,"#29374c");
 rect(x+8,y+15,4,6,"#29374c");
 rect(x+2,y+20,5,2,"#10141c");
 rect(x+8,y+20,5,2,"#10141c");
 // armor
 rect(x+2,y+8,11,9,"#8da4b8");
 rect(x+1,y+10,13,6,"#60778d");
 rect(x+4,y+9,6,5,"#c4d0d8");
 // arm
 rect(x,y+10,3,7,"#b4c2cc");
 rect(x+12,y+10,3,7,"#b4c2cc");
 // helmet
 rect(x+2,y+2,11,7,"#a8b8c8");
 rect(x+1,y+4,13,4,"#71889e");
 rect(x+4,y+3,7,2,"#dbe6ed");
 // visor
 rect(x+3,y+6,9,2,"#202a3c");
 rect(x+8,y+6,3,1,"#f3d16b");
 // sword
 if(touch.attack||keys[" "]){
  rect(x+(player.face>0?14:-5),y+7,5,2,"#e5edf4");
  rect(x+(player.face>0?17:-6),y+5,2,6,"#ffe48a");
 }else{
  rect(x+(player.face>0?12:-3),y+13,3,7,"#dce5ed");
 }
}

function drawEnemy(e){
 rect(e.x,e.y+13,14,2,"#191520");
 rect(e.x+2,e.y+4,10,10,"#653d48");
 rect(e.x+1,e.y+2,12,7,"#a7525c");
 rect(e.x+3,e.y+1,8,4,"#d07876");
 rect(e.x+3,e.y+6,3,2,"#fff");
 rect(e.x+8,e.y+6,3,2,"#fff");
 rect(e.x+4,e.y+6,2,2,"#24212d");
 rect(e.x+9,e.y+6,2,2,"#24212d");
 rect(e.x+2,e.y+12,4,3,"#342b3b");
 rect(e.x+8,e.y+12,4,3,"#342b3b");
}

function drawCoin(c){
 if(c.taken)return;
 let bob=Math.sin(frame/8)*2;
 rect(c.x+3,c.y+bob,6,9,"#b97822");
 rect(c.x+2,c.y+1+bob,8,7,"#ffd34e");
 rect(c.x+4,c.y+2+bob,4,5,"#fff0a0");
}

function drawBackground(){
 rect(0,0,W,H,"#111827");
 // moon
 rect(370-camera*.05,35,25,25,"#c9d4e6");
 rect(375-camera*.05,31,25,25,"#111827");
 // distant mountains
 for(let i=0;i<7;i++){
  let x=i*100-camera*.15;
  rect(x,150,90,120,"#202b40");
  rect(x+15,130,60,30,"#202b40");
  rect(x+30,115,30,15,"#202b40");
 }
 // trees
 for(let i=0;i<22;i++){
  let x=i*90-camera*.35;
  rect(x+15,175,8,35,"#362d40");
  rect(x,155,38,30,"#263c43");
  rect(x+7,145,25,25,"#304d50");
  rect(x+13,135,14,15,"#3c625c");
 }
}

function drawPlatforms(){
 for(let p of platforms){
  rect(p.x,p.y,p.w,p.h,"#342d3b");
  rect(p.x,p.y,p.w,4,"#526b59");
  rect(p.x,p.y+4,p.w,3,"#354b43");
  for(let x=p.x+10;x<p.x+p.w;x+=24){
   rect(x,p.y+10,4,4,"#514151");
   rect(x+8,p.y+18,3,3,"#433746");
  }
 }
}

function update(){
 frame++;
 if(dead||won)return;

 let speed=1.5;
 player.vx=0;
 if(keys["ArrowLeft"]||touch.left){player.vx=-speed;player.face=-1}
 if(keys["ArrowRight"]||touch.right){player.vx=speed;player.face=1}

 player.x+=player.vx;
 player.vy+=0.32;
 if(player.vy>6)player.vy=6;
 player.y+=player.vy;
 player.grounded=false;

 for(let p of platforms){
  if(player.x+player.w>p.x&&player.x<p.x+p.w&&
     player.y+player.h>=p.y&&player.y+player.h<=p.y+12&&player.vy>=0){
   player.y=p.y-player.h;
   player.vy=0;
   player.grounded=true;
  }
 }

 if((keys["ArrowUp"]||touch.jump)&&player.grounded){
  player.vy=-6.5;
  player.grounded=false;
 }
 if(player.inv>0)player.inv--;

 // coins
 for(let c of treasure){
  if(!c.taken&&Math.abs(player.x-c.x)<17&&Math.abs(player.y-c.y)<22){
   c.taken=true;coins++;
   document.getElementById("coins").textContent=coins;
  }
 }

 // enemies
 for(let e of enemies){
  if(!e.alive)continue;
  e.x+=e.vx;
  if(e.x<300||e.x>1600)e.vx*=-1;

  if(touch.attack||keys[" "]){
   let inFront=player.face>0?e.x>player.x&&e.x<player.x+35:e.x<player.x&&e.x>player.x-25;
   if(inFront&&Math.abs(e.y-player.y)<25)e.alive=false;
  }

  if(Math.abs(player.x-e.x)<13&&Math.abs(player.y-e.y)<18&&player.inv==0){
   if(player.vy>1&&player.y<e.y){
    e.alive=false;player.vy=-4;
   }else{
    hp--;player.inv=60;
    document.getElementById("hp").textContent=hp;
    player.vy=-3;
    if(hp<=0)dead=true;
   }
  }
 }

 if(player.y>300)dead=true;
 camera=Math.max(0,Math.min(player.x-160,1800));
 if(player.x>1900)won=true;
}

function draw(){
 drawBackground();
 ctx.save();
 ctx.translate(-Math.floor(camera),0);
 drawPlatforms();
 for(let c of treasure)drawCoin(c);
 for(let e of enemies)if(e.alive)drawEnemy(e);
 if(player.inv%8<4||player.inv===0)drawKnight(player.x,player.y);
 ctx.restore();

 if(dead){
  document.getElementById("msg").innerHTML="YOU DIED<br><small>แตะหน้าจอเพื่อเริ่มใหม่</small>";
  document.getElementById("msg").style.display="block";
 }else if(won){
  document.getElementById("msg").innerHTML="VICTORY!<br>🪙 "+coins+" COINS";
  document.getElementById("msg").style.display="block";
 }else{
  document.getElementById("msg").style.display="none";
 }
}

function loop(){
 update();draw();requestAnimationFrame(loop);
}
loop();

function bindButton(id,key){
 let b=document.getElementById(id);
 b.addEventListener("pointerdown",e=>{
  e.preventDefault();touch[key]=true;b.setPointerCapture(e.pointerId);
 });
 b.addEventListener("pointerup",e=>{e.preventDefault();touch[key]=false});
 b.addEventListener("pointercancel",()=>touch[key]=false);
 b.addEventListener("pointerleave",()=>touch[key]=false);
}
bindButton("left","left");
bindButton("right","right");
bindButton("jump","jump");
bindButton("attack","attack");

window.addEventListener("keydown",e=>{
 keys[e.key]=true;
 if(e.key==="ArrowUp"||e.key===" ")e.preventDefault();
});
window.addEventListener("keyup",e=>keys[e.key]=false);

canvas.addEventListener("pointerdown",()=>{
 if(dead||won){
  dead=false;won=false;hp=3;coins=0;camera=0;
  player.x=50;player.y=180;player.vx=0;player.vy=0;
  enemies.forEach((e,i)=>{e.alive=true});
  treasure.forEach(c=>c.taken=false);
  document.getElementById("hp").textContent=hp;
  document.getElementById("coins").textContent=coins;
 }
});

</script>
</body>
</html>
